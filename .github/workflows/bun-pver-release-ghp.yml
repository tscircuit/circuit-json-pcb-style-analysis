name: Publish to GitHub Packages

on:
  push:
    branches:
      - main
      - "!version-bumps/**"
  workflow_dispatch:

concurrency:
  group: publish-github-packages
  cancel-in-progress: false

permissions:
  contents: write
  packages: write
  pull-requests: write

jobs:
  release-check:
    runs-on: ubuntu-latest
    outputs:
      publish: ${{ steps.check.outputs.publish }}
    steps:
      - uses: actions/checkout@v4
      - id: check
        env:
          MANUAL_RELEASE: ${{ github.event_name == 'workflow_dispatch' }}
        run: |
          if [ "$MANUAL_RELEASE" = "true" ] || ! git log -1 --pretty=%s | grep -Eq '^(chore: bump version|v[0-9]+\.[0-9]+\.[0-9]+($|[[:space:]]))'; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
          else
            echo "publish=false" >> "$GITHUB_OUTPUT"
          fi
  publish:
    needs: release-check
    if: needs.release-check.outputs.publish == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://npm.pkg.github.com
          scope: "@tscircuit"
      - run: bun install
      - run: bun run typecheck
      - run: bun test
      - run: bun run build
      - name: Publish package
        run: bunx pver release --no-push-main
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Get package version
        id: package-version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
      - name: Create version-bump pull request
        id: create-pr
        uses: peter-evans/create-pull-request@v6
        with:
          commit-message: "chore: bump version"
          title: "chore: bump version to v${{ steps.package-version.outputs.version }}"
          body: "Automated package update"
          branch: version-bumps/v${{ steps.package-version.outputs.version }}
          base: main
          token: ${{ secrets.TSCIRCUIT_BOT_GITHUB_TOKEN }}
          committer: tscircuitbot <githubbot@tscircuit.com>
          author: tscircuitbot <githubbot@tscircuit.com>
      - name: Enable version-bump auto-merge
        if: steps.create-pr.outputs.pull-request-number != ''
        run: >-
          gh pr merge ${{ steps.create-pr.outputs.pull-request-number }} --auto --squash --delete-branch --subject "chore: bump version to v${{ steps.package-version.outputs.version }}"
        env:
          GH_TOKEN: ${{ secrets.TSCIRCUIT_BOT_GITHUB_TOKEN }}
